services:
  postgres:
    image: postgres:17
    container_name:  ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
      POSTGRES_DB: ecommerce_db
    ports:
      - "5433:5432"
    volumes:
      - ecommerce-postgres-data:/var/lib/postgresql/data

volumes:
  ecommerce-postgres-data:

